id: case-20261004-chat-action-navigation-and-multi-turn-sync
title: "Resolusi Tombol Aksi Chat Menutup Tiba-Tiba, Error 404 /lacak-pesanan & Sinkronisasi Konteks Multi-Turn Gemini AI"
domain: "ai-chat-live-interactive-state"
severity: "HIGH"
status: "VERIFIED"
created_at: "2026-10-04"
tags:
  - "ai-copilot"
  - "live-chat"
  - "multi-turn-context"
  - "lacak-pesanan-public-tracking"
  - "cod-meetup-modal"
  - "interactive-widgets"
  - "zustand-state"

problem_description: |
  1. Pada LiveChatWidget storefront, ketika pembeli mengklik tombol aksi navigasi cepat (seperti "Lihat 6 Titik Temu COD"
     atau "Buka Custom Studio"), jendela live chat langsung menutup sendiri secara tiba-tiba tanpa memunculkan tampilan/modal
     yang diinginkan pembeli. Hal ini disebabkan adanya `onActionTriggered={() => setIsOpen(false)}` serta selector DOM
     yang mencari elemen kosong atau ID yang tidak cocok (`#cod-meetup` kosong, `#custom-studio` vs `#custom`).
  2. Ketika pembeli mengklik tombol aksi "Cek Status Pesanan", aplikasi menampilkan halaman Error 404 karena tautan yang
     dihasilkan mengarah ke `/lacak-pesanan` atau `/lacak-pesanan?inv=...` sedangkan direktori `apps/web/src/app/lacak-pesanan`
     belum diimplementasikan dalam Next.js App Router (meskipun telah didefinisikan dalam Seksi 34 PRD).
  3. Riwayat percakapan chat sebelumnya (multi-turn) tidak tersinkronisasi dengan cerdas ke AI Copilot, di mana query
     grounding hanya memeriksa pesan tunggal terakhir dan riwayat percakapan hanya di-flatten sebagai string ke single-turn prompt,
     sehingga AI mengabaikan pertanyaan sebelumnya atau mengulang salam pembuka (double greeting).

root_cause: |
  1. Callback `onActionTriggered={() => setIsOpen(false)}` pada LiveChatWidget secara agresif menutup jendela chat pada setiap klik aksi.
  2. Komponen CODLocationsModal sebelumnya hanya dimount lokal di page.tsx dan mengandalkan custom DOM event yang rentan race condition,
     serta tidak ada card visual di anchor `#cod-meetup`.
  3. Direktori `apps/web/src/app/lacak-pesanan/` belum ada dalam proyek, sehingga deep link pelacakan publik dari tombol aksi chat
     maupun tautan WhatsApp menghasilkan HTTP 404.
  4. Komponen `GuestTracker` sebelumnya belum mendukung prop `initialInvoice` untuk auto-lookup saat dibuka melalui URL parameter.
  5. Service `ai-chat-assistant.service.ts` memanggil `retrieveGroundingContext` hanya dengan string pesan terakhir sehingga kehilangan
     entitas yang disebut pada giliran pesan sebelumnya (produk, lokasi COD, invoice dll).
  6. Pemanggilan Gemini API hanya mengirim single user prompt dengan riwayat pesan digabung sebagai teks mentah, bukan format multi-turn
     resmi Google (`role: 'user'` dan `role: 'model'`).

solution_pattern: |
  1. Hapus auto-close `setIsOpen(false)` dari LiveChatWidget sehingga jendela chat tetap terbuka dan interaksi terasa mulus.
  2. Pindahkan state `isCodModalOpen` ke Zustand `useChatStore` (`openCodModal()`, `closeCodModal()`) dan pasang `CODLocationsModal`
     secara universal di `app/layout.tsx` agar dapat dibuka secara reaktif dari halaman manapun.
  3. Implementasikan halaman pelacakan publik resmi PRD Seksi 34 pada `apps/web/src/app/lacak-pesanan/page.tsx` dengan Hero Banner,
     Breadcrumb, Suspense boundary untuk `useSearchParams()`, serta integrasi `GuestTracker`.
  4. Perbarui `GuestTracker` agar menerima prop `initialInvoice?: string` dan memprioritaskan pengambilan data live via API PostgreSQL
     sebelum fallback ke local state, sehingga status pesanan langsung tampil saat halaman dimuat.
  5. Arahkan tombol aksi `TRACK_ORDER` di `ChatInteractiveWidgets.tsx` langsung ke `/lacak-pesanan?inv=${encodeURIComponent(inv)}`.
  6. Perluas `retrieveGroundingContext` untuk memindai teks gabungan seluruh riwayat pesan obrolan multi-turn (combined conversation context).
  7. Format payload Gemini API menggunakan percakapan multi-turn native (`contents: multiTurnContents` dengan pergantian role `user` dan `model`
     yang valid), serta integrasikan multi-turn context ke `generateDeterministicFallback`.

verification_and_tests: |
  1. TypeScript type-check pada apps/web dan apps/api lolos 100% dengan 0 error kompilasi (`npm run type-check`).
  2. Unit test suite Vitest pada `apps/api` (84 tests di 10 test files) lolos 100% (`npm run test:unit`).
  3. Playwright E2E browser automation memverifikasi bahwa:
     - Navigasi ke `http://localhost:3000/lacak-pesanan?inv=INV-20261003-9171` mengembalikan HTTP 200 (bebas 404).
     - Rincian pesanan pembeli Annisa Larasati terisi otomatis dengan stepper 4 langkah, info item "Custom Buket Tulip Cantik", dan status "Pembayaran Terkonfirmasi".
     - Tangkapan layar visual (`lacak_pesanan_direct.png`) membuktikan tata letak responsif dan estetik sesuai tema atelier.
